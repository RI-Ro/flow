# =====================================================================
# Команда — пример конфигурации
#
# Запуск:
#   ./api --config /etc/kanban/config.yaml
#   CONFIG_FILE=/etc/kanban/config.yaml ./api
#
# Если путь не указан, ищется ./config.yaml рядом с исполняемым файлом.
# Файла нет — приложение работает на значениях по умолчанию.
#
# ПРИОРИТЕТЫ: переменная окружения > этот файл > значение по умолчанию.
# Окружение выше файла сознательно: в systemd и контейнерах секреты
# передаются именно так, и возможность переопределить один параметр,
# не трогая файл, нужна чаще, чем обратное.
#
# Любой раздел и любой параметр можно опустить — возьмётся значение по
# умолчанию, указанное в комментарии.
#
# ВАЖНО про права доступа: здесь пароль базы и ключ подписи токенов.
#   chmod 600 config.yaml
# =====================================================================

server:
  # Адрес и порт. Без указания хоста слушаются все сетевые интерфейсы —
  # приложение доступно с других машин.
  #   ":8080"           — все интерфейсы
  #   "127.0.0.1:8080"  — только локально (за обратным прокси)
  # По умолчанию: ":8080"
  addr: ":8080"

  # Режим работы.
  #   development — подробности ошибок базы возвращаются клиенту,
  #                 недостающие настройки заменяются значениями по
  #                 умолчанию
  #   production  — наружу только общие формулировки, отсутствие
  #                 database.url или auth.jwt_secret останавливает запуск
  # По умолчанию: development
  env: production

  # Каталог с собранным интерфейсом (frontend/dist после npm run build).
  # Если задан, тот же сервер отдаёт и интерфейс, и API — всё приложение
  # доступно по одному адресу, без отдельного веб-сервера и без CORS.
  # Пусто — работает только API.
  # По умолчанию: пусто
  static_dir: /opt/kanban/web

  # Адреса обратных прокси, чьему заголовку X-Forwarded-For можно верить.
  #
  # ОБЯЗАТЕЛЬНО задать при работе за nginx или haproxy: иначе приложение
  # видит адрес прокси вместо адреса клиента, и ограничение частоты
  # становится общим на всех пользователей сразу — один активный
  # сотрудник исчерпает лимит за остальных.
  #
  # Оставьте пустым при прямой работе: доверять этому заголовку от
  # произвольного клиента нельзя, он его подделает.
  # По умолчанию: пусто
  trusted_proxies:
    - 127.0.0.1
    - ::1

  # Источники, которым разрешены запросы к API. Нужно, только если
  # интерфейс отдаётся с другого адреса. При заданном static_dir
  # источник один и этот параметр не используется.
  # По умолчанию: http://localhost:5173
  allowed_origins:
    - https://team.example.com

  # Предел запросов в минуту с одного адреса. Вход и регистрация
  # ограничены отдельно и жёстче (20 в минуту) — это защита от подбора
  # пароля и здесь не настраивается.
  # По умолчанию: 600
  rate_limit_per_min: 600

database:
  # Готовая строка подключения. Если задана, поля ниже игнорируются.
  #
  # РОЛЬ ПОДКЛЮЧЕНИЯ ИМЕЕТ ЗНАЧЕНИЕ. Указывайте app_user — она создаётся
  # миграцией 0000_roles.sql и намеренно лишена права обходить политики
  # доступа. С ролью postgres приложение поднимется и внешне будет
  # работать, но разграничение прав отключится полностью: каждый
  # пользователь увидит задачи всех проектов. Приложение проверяет это
  # при старте и откажется запускаться.
  # По умолчанию: postgres://app_user:change_me_user@localhost:5432/kanban?sslmode=disable
  url: postgres://app_user:ПАРОЛЬ@localhost:5432/kanban?sslmode=disable

  # Альтернатива url — по частям. Удобно, когда пароль подставляется
  # отдельно. Используются, только если url не задан.
  # host: localhost          # по умолчанию: localhost
  # port: 5432               # по умолчанию: 5432
  # name: kanban             # по умолчанию: kanban
  # user: app_user           # по умолчанию: app_user
  # password: ПАРОЛЬ
  # sslmode: disable         # disable | require | verify-ca | verify-full

  # Размер пула соединений.
  #
  # Это НЕ «одно соединение на пользователя»: запрос занимает соединение
  # на единицы миллисекунд, поэтому 40 соединений с запасом обслуживают
  # несколько сотен человек. Суммарно по всем экземплярам на машине не
  # должен превышать max_connections в PostgreSQL (по умолчанию 100).
  # По умолчанию: 40
  pool_size: 40

  # Сколько соединений держать открытыми в простое. Больше — быстрее
  # отклик после затишья, но соединения занимают память в PostgreSQL.
  # По умолчанию: 8
  min_idle: 8

auth:
  # Ключ подписи access-токенов, не короче 32 байт.
  #   openssl rand -base64 48
  #
  # Не задан в режиме development — генерируется случайный при каждом
  # запуске, и все сессии слетают при перезапуске. В production
  # отсутствие ключа останавливает запуск.
  #
  # При нескольких экземплярах ключ у каждого свой: общий позволил бы
  # предъявить токен, выданный одной установкой, другой.
  jwt_secret: ЗАМЕНИТЬ_НА_СЛУЧАЙНУЮ_СТРОКУ

  # Срок жизни access-токена. Чем короче, тем быстрее вступают в силу
  # блокировка учётной записи и снятие прав администратора — отозвать
  # уже выданный подписанный токен нельзя. Плата — более частое
  # обновление (происходит незаметно для пользователя).
  # Формат: 15m, 1h, 30s. По умолчанию: 15m
  access_ttl: 15m

  # Срок сессии: сколько человек остаётся в системе без повторного
  # ввода пароля. По умолчанию: 720h (30 суток)
  refresh_ttl: 720h

  # Самостоятельная регистрация.
  #
  # false — учётные записи заводит только администратор. Исключение:
  # на совершенно пустой базе первая регистрация разрешена всегда и
  # сразу даёт права администратора, иначе после установки войти было
  # бы некому.
  # true — зарегистрироваться может любой, кто открыл адрес.
  # По умолчанию: false
  allow_self_registration: false

uploads:
  # Каталог для вложений и загруженных фонов. Относительный путь
  # разрешается от рабочего каталога процесса.
  # По умолчанию: ./var/uploads
  dir: /opt/kanban/uploads

  # Предел размера одного файла в мегабайтах.
  #
  # Если перед приложением стоит nginx, его client_max_body_size должен
  # быть НЕ МЕНЬШЕ этого значения плюс запас на служебные поля формы,
  # иначе загрузка оборвётся с ошибкой 413 ещё до приложения.
  # По умолчанию: 25
  max_size_mb: 25

features:
  # Видеовызовы. Управляет и кнопками «Видеозвонок» / «Видеоконференция»
  # в интерфейсе, и самой возможностью собрать ссылку вызова.
  #
  # Вызов открывается по схеме callto:, которую обрабатывает
  # установленный в организации клиент телефонии. Если такого клиента
  # нет, ставьте false — иначе кнопки будут вести в никуда.
  # По умолчанию: true
  video_calls: true

  # Массовая почтовая рассылка участникам задачи одним письмом
  # с заготовленной темой и текстом.
  # По умолчанию: true
  group_email: true

branding:
  # Название в интерфейсе и заголовке вкладки браузера.
  # По умолчанию: Команда
  app_name: Команда
