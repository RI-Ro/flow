# =====================================================================
# haproxy — альтернатива nginx. Имеет смысл, если нужны развитые
# проверки работоспособности и вывод экземпляра из обслуживания на
# ходу. Для простого разделения по именам достаточно nginx.
#
# ВАЖНО про балансировку: несколько экземпляров ОДНОГО сайта за
# балансировщиком сломают синхронизацию в реальном времени. Причина —
# в ЗАПУСК-SYSTEMD.md, раздел «Почему нельзя размножать один сайт».
# Здесь каждый backend — отдельный сайт со своей базой, а не копия.
# =====================================================================

global
    maxconn 20000
    log /dev/log local0
    # Дескрипторы: каждое WebSocket-соединение живёт долго и занимает
    # по сокету с обеих сторон.
    ulimit-n 65535

defaults
    mode http
    log global
    option httplog
    option forwardfor          # добавляет X-Forwarded-For
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    # Отдельный, намного больший таймаут для соединений, перешедших в
    # режим туннеля, — то есть для WebSocket. Без него соединение
    # рвалось бы по timeout client каждую минуту.
    timeout tunnel  1h

frontend https_in
    bind :443 ssl crt /etc/haproxy/certs/
    http-request redirect scheme https unless { ssl_fc }

    # Разбор по имени: каждое имя — свой экземпляр.
    acl host_alpha hdr(host) -i alpha.example.com
    acl host_beta  hdr(host) -i beta.example.com
    acl host_gamma hdr(host) -i gamma.example.com

    use_backend kanban_alpha if host_alpha
    use_backend kanban_beta  if host_beta
    use_backend kanban_gamma if host_gamma
    default_backend kanban_alpha

backend kanban_alpha
    option httpchk GET /healthz
    http-check expect status 200
    server a1 127.0.0.1:8081 check inter 5s fall 3 rise 2

backend kanban_beta
    option httpchk GET /healthz
    http-check expect status 200
    server b1 127.0.0.1:8082 check inter 5s fall 3 rise 2

backend kanban_gamma
    option httpchk GET /healthz
    http-check expect status 200
    server g1 127.0.0.1:8083 check inter 5s fall 3 rise 2
