# =====================================================================
# nginx: несколько имён, каждое — на свой экземпляр.
#
# Задача прокси здесь — НЕ ускорение (см. ЗАПУСК-SYSTEMD.md), а
# распределение по именам на одном порту 443 и терминирование TLS.
#
#   sudo cp nginx-kanban.conf /etc/nginx/sites-available/kanban
#   sudo ln -s /etc/nginx/sites-available/kanban /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =====================================================================

# Соответствие имени и порта экземпляра. Добавить сайт — добавить
# строку здесь и подставить $upstream_port ниже.
map $host $kanban_port {
    default            8081;
    alpha.example.com  8081;
    beta.example.com   8082;
    gamma.example.com  8083;
}

# Заголовок Connection для апгрейда: при обычном запросе он должен
# остаться пустым, а не превратиться в "upgrade" — иначе nginx будет
# закрывать keep-alive на каждом запросе.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name alpha.example.com beta.example.com gamma.example.com;
    # Единственное назначение — проверка ACME и перенаправление.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alpha.example.com beta.example.com gamma.example.com;

    # Сертификат с несколькими именами (SAN) либо отдельные server-блоки
    # на каждое имя, если сертификаты разные.
    ssl_certificate     /etc/letsencrypt/live/alpha.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alpha.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Не меньше MAX_UPLOAD_MB приложения, плюс запас на служебные поля
    # multipart. Иначе загрузка файла обрывается с 413 ещё до Go.
    client_max_body_size 30m;

    # Загрузку не буферизуем целиком на диск: файл сразу течёт в
    # приложение, которое само проверяет размер и тип.
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:$kanban_port;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Приложение берёт из этого заголовка адрес клиента для
        # ограничения частоты запросов. Без него все запросы выглядели
        # бы как приходящие с одного адреса — самого прокси, — и лимит
        # срабатывал бы на всех сразу.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- WebSocket ---
        # Без этих трёх строк соединение не поднимется, и синхронизация
        # между пользователями работать не будет: события просто не
        # дойдут. Внешне это выглядит как «всё открывается, но изменения
        # у других не появляются».
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Соединение WebSocket долгоживущее и большую часть времени
        # молчит. Стандартные 60 секунд обрывали бы его каждую минуту,
        # заставляя клиента переподключаться. Приложение само посылает
        # ping, поэтому часа с запасом достаточно.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Ответы приложения не буферизуем: события реального времени
        # должны уходить клиенту сразу, а не по заполнению буфера.
        proxy_buffering off;
    }
}
